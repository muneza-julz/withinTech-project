<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Business Card</title>
<style>
  html{
     font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
     font-size:30px;
    
  }

  body {
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 40px;
  }
 
  .card1{
    min-height: 400px ;
    width: 1200px;
    margin: 100px 0 0 0;
    border: 5px solid blue;
   
    margin-left: 30px;
    align-items: baseline;
    display: flex;
    justify-content: space-around;
    /* gap: 60px; */
    border-radius: 24px;
  }

  .description{
    margin-bottom: 5px;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
  }







 
 


</style>
</head>
<body>

<div class="card1">
    <div class="image"><img src="../public/pics/IMG_1847.JPG"  width="150" height="150px"></div>
    
    <div class="description">
      <div class="name-block" style="margin-bottom: 24px;">
        <div class="name">MUNEZA JULES</div>
        <div class="title">Marketing Manager</div>
      </div>
      <div class="contact-list">
        <div class="contact-line">Tel: (250) 123 4567 89</div>
        <div class="contact-line">link:  www.rca.rw</div>
        <div class="contact-line">Email: eusebemuneza@gmail.com</div>
      </div>
    </div>
  </div>

 
  <div class="card2">
    <div class="logo-hex"><div class="inner"></div></div>
    <div class="brand-name"><span class="bold">MY</span> Company</div>
    <div class="brand-sub">Best Company</div>
    
  </div>

</body>
</html>
