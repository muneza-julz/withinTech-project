<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <style>
      * {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Open Sans",
          "Helvetica Neue",
          sans-serif;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <form action="#" class="form-group">
      <h1>Login portal</h1>
      <label for="fname">First name</label>
      <input type="text" name="fname" class="form-input">First name</input>

      <label for="lname">Last name</label>
      <input type="text" name="lname" class="form-input"></input>
      <label for="email" class="form-label"></label>
      <input
        type="email"
        name="email"
        class="form-input"
        placeholder="name@gmail.com"
      />
      <label for="password" class="form-label">Password</label>
      <input
        type="password"
        name="password"
        id="password"
        class="form-input"
        min="8"
        max="30"
      />
      <label for="" class="form-label">Telephone</label>
      <input
        type="tel"
        name="telephone"
        id="telephone"
        class="form-input"
        min=1
      />
      <label for="date" class="form-label">Birth date</label>
      <input type="date" name="date">
      <select class="form-select">
        <option value="1" class="form-option">HTML</option>
        <option value="2" class="form-option">CSS</option>
        <option value="3" class="form-option">Javascript</option>
        <option value="4" class="form-option"></option>
      </select>
      
      <label for="male" class="form-label">Gender</label>
      <input type="radio" class="form-input" name="male">
      <label for="male" class="form-label">Male</label>
      <input type="radio" class="form-input" name="male">
      <label for="male" class="form-label">Female</label>
      <p>Hobbies</p>

      <input type="checkbox">Gaming</input>
      <input type="checkbox">cooking</input>
      <input type="checkbox">playing</input>
      <input type="checkbox">Gaming</input>
      <button class="btn" style="background-color: aqua;">Register</button>
      <button class="btn" style="background-color: aqua; border: 0;">Reset form</button>
    </form>
  </body>
</html>
