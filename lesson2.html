<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hero Card</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .card {
        width: 400px;
        padding: 2rem;
        background: white;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        text-align: center;
      }

      .hero-title {
        font-size: 2rem;
        font-weight: bold;
        color: #1e3a8a;
        margin-bottom: 1rem;
      }

      .hero-text {
        color: #555;
        line-height: 1.6;
        margin-bottom: 1.5rem;
      }

      .btn {
        display: inline-block;
        padding: 12px 24px;
        background: #2563eb;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 600;
        transition: background-color 0.3s ease;
      }

      .btn:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 class="hero-title">Welcome Aboard!</h1>

      <p class="hero-text">
        Discover amazing content, learn new skills, and explore exciting
        opportunities designed just for you.
      </p>

      <a href="#" class="btn">View More</a>
    </div>
  </body>
</html>
